# Build and upload the exe to a GitHub Release when a version tag (e.g. v0.1.0) is pushed.
# Usage: git tag v0.1.0 && git push origin v0.1.0

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build and upload release asset
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Strip the leading 'v' from the tag, e.g. v0.1.0 -> 0.1.0
      - name: Get tag name
        id: meta
        shell: bash
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # Cache cargo dependencies to speed up later builds
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            codex-gauge/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build (release)
        working-directory: codex-gauge
        run: cargo build --release

      # Rename to a versioned filename
      - name: Rename artifact
        shell: bash
        run: |
          mkdir -p dist
          cp codex-gauge/target/release/codex-gauge.exe \
             "dist/codex-gauge-${{ steps.meta.outputs.VERSION }}-x86_64-pc-windows-msvc.exe"

      # Build structured release notes from Conventional Commits since the last
      # tag (e.g. "feat: ..." -> ### Added). Falls back to a plain commit list.
      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          echo "## What's Changed" > NOTES.md
          # Most recent tag visible from the previous commit (empty for the
          # very first release), plus the current tag.
          LAST_TAG=$(git describe --abbrev=0 --tags HEAD~1 2>/dev/null || true)
          if [ -n "$LAST_TAG" ] && [ "$LAST_TAG" != "${{ github.ref_name }}" ]; then
            LOG=$(git log "$LAST_TAG"..HEAD --pretty=format:'%s' --no-merges 2>/dev/null || true)
          else
            LOG=$(git log --pretty=format:'%s' --no-merges 2>/dev/null || true)
          fi
          if [ -n "$LOG" ]; then
            {
              echo ""
              echo '### Added'
              echo "$LOG" | grep -iE '^feat' || true
              echo ""
              echo '### Fixed'
              echo "$LOG" | grep -iE '^fix' || true
              echo ""
              echo '### Changed'
              echo "$LOG" | grep -iE '^(refactor|perf|style)' || true
              echo ""
              echo '### Docs'
              echo "$LOG" | grep -iE '^docs' || true
              echo ""
              echo '### Other'
              echo "$LOG" | grep -ivE '^(feat|fix|refactor|perf|style|docs)' || true
            } >> NOTES.md
          else
            echo "" >> NOTES.md
            echo "No notable changes recorded." >> NOTES.md
          fi

      # Upload the exe to the Release for this tag, with the notes above.
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          body_path: NOTES.md
